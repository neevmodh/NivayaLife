[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand + a low ceiling: Koyeb's free instance has ~512MB total RAM
; shared with nginx, the queue worker, and Tesseract during OCR bursts, so
; idle PHP-FPM workers can't be allowed to sit around holding memory.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s

php_admin_value[memory_limit] = 128M

clear_env = no
